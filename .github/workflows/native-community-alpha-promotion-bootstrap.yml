name: Native Community Alpha Promotion Bootstrap

on:
  workflow_run:
    workflows:
      - Native CI
    types:
      - completed
    branches:
      - 2.x

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch-candidate:
    name: Dispatch exact 2.x candidate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing promotion workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          NATIVE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh workflow run native-community-alpha-promotion.yml \
            --repo "$REPO" \
            --ref 2.x \
            -f "source_commit=$SOURCE_COMMIT" \
            -f "native_ci_run_id=$NATIVE_CI_RUN_ID"
