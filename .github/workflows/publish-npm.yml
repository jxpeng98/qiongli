name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    if: ${{ !startsWith(github.ref_name, 'v2.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/qiongli
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject native release lines
        run: |
          release_line="$(python3 scripts/release_version.py "${RELEASE_TAG}" --print-field release_line)"
          if [[ "$release_line" == "native-2x" ]]; then
            echo "[npm-publish] RLS-201/PKG gate: native 2.x tags must not publish the frozen npm package" >&2
            exit 1
          fi

      - name: Install Python runtime dependency
        run: python -m pip install -e .

      - name: Materialize distribution payloads
        run: python3 scripts/materialize_distribution_payloads.py --target all --out "$RUNNER_TEMP/qiongli-dist" --force

      - name: Verify tag matches repo version
        run: bash scripts/verify_release_tag_version.sh --root "$RUNNER_TEMP/qiongli-dist" --tag "${RELEASE_TAG}"

      - name: Run npm package preflight
        run: bash scripts/npm_preflight.sh --root "$RUNNER_TEMP/qiongli-dist"

      - name: Publish to npm
        working-directory: ${{ runner.temp }}/qiongli-dist/packages/npm-qiongli
        run: |
          release_line="$(python3 "${GITHUB_WORKSPACE}/scripts/release_version.py" "${RELEASE_TAG}" --print-field release_line)"
          channel="$(python3 "${GITHUB_WORKSPACE}/scripts/release_version.py" "${RELEASE_TAG}" --print-field channel)"
          if [[ "$release_line" == "native-2x" ]]; then
            echo "[npm-publish] RLS-201/PKG gate: refusing native 2.x registry publication" >&2
            exit 1
          fi
          if [[ "$channel" != "stable" ]]; then
            npm publish --tag next
            latest="$(npm view qiongli dist-tags.latest --silent || true)"
            if [[ "$latest" == *"-beta."* ]]; then
              npm dist-tag rm qiongli latest || echo "[npm-publish] warning: unable to remove beta latest dist-tag"
            fi
          else
            npm publish --tag latest
          fi
