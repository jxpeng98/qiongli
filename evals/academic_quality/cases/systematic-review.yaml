schema_version: "1.0"
case_id: systematic-review
pipeline: systematic-review-prisma
description: Require executable review eligibility, screening, and synthesis evidence.
input:
  topic: Assess a systematic review of digital interventions for adolescent mental health.
  domain: psychology
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - Eligibility criteria
          - PRISMA screening counts
          - Risk of bias
          - Strength and heterogeneity of evidence
