name: Evaluation Truth

on:
  push:
    branches: ["2.x"]
  pull_request:
    branches: ["2.x"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluation-truth:
    name: Evaluation Truth V1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run canonical evaluation suite
        run: python evals/runner/run_suite.py
