name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # Required for trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/qiongli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -e . build twine

      - name: Inject packaged upstream defaults
        env:
          RESEARCH_SKILLS_REPO_SLUG: jxpeng98/qiongli
        run: bash scripts/inject_project_toml.sh

      - name: Sync generated distribution payloads
        run: |
          bash scripts/sync_skill_package.sh --target all
          python3 scripts/sync_npm_package_payload.py

      - name: Verify tag matches repo version
        run: bash scripts/verify_release_tag_version.sh --tag "${GITHUB_REF_NAME}"

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
