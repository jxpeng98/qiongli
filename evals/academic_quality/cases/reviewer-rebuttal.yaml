schema_version: "1.0"
case_id: reviewer-rebuttal
pipeline: empirical-study
description: Require an evidence-backed response and a concrete manuscript revision.
input:
  topic: Assess a rebuttal to a reviewer who challenges the study's identification assumptions.
  domain: general
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - Reviewer concern
          - Evidence-backed response
          - Exact manuscript revision
          - Unresolved limitation
