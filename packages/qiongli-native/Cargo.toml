[workspace]
resolver = "3"
members = ["apps/qiongli", "crates/qiongli-content"]
default-members = ["apps/qiongli"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.97"
authors = ["Jiaxin Peng"]
license = "MIT"
repository = "https://github.com/jxpeng98/qiongli"
publish = false

[workspace.metadata.qiongli]
product = "qiongli"
channel = "alpha"

[workspace.dependencies]
same-file = "1.0.6"
semver = "1.0.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"
