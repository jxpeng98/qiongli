policy_version: "1.0.0"
stage_defaults:
  B_literature:
    primary: claude
    reviewer: codex
    verifier: codex
  F_writing:
    primary: claude
    reviewer: codex
    verifier: codex
  I_code:
    primary: codex
    reviewer: claude
    verifier: codex
solo_gate_mappings:
  solo_codex:
    writing_gates:
      - evidence_ledger_check
      - citation_risk_check
      - claim_calibration_check
      - scholarly_voice_check
    code_gates:
      - tests
      - strict_validator
      - diff_review
  solo_claude:
    writing_gates:
      - evidence_ledger_check
      - citation_risk_check
      - reviewer_self_critique
    code_gates:
      - implementation_intent
      - declared_write_set
      - failing_test_first
      - command_evidence
      - rollback_notes
