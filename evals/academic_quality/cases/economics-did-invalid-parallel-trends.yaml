schema_version: "1.0"
case_id: economics-did-invalid-parallel-trends
pipeline: empirical-study
description: Detect unsupported parallel-trends evidence in a Difference-in-Differences design.
input:
  topic: Assess a Difference-in-Differences design whose pre-trend event-study coefficients are missing or fail.
  domain: economics
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - "Gate: Q1"
          - "Severity: block"
          - Difference-in-Differences design does not report credible parallel-trends support from pre-trend event-study coefficients.
