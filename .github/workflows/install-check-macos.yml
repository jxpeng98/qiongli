name: macOS Checkout Install Check

on:
  pull_request:
    branches: ["main", "master", "dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-checkout-bootstrap:
    name: Unix Bootstrap From Checkout (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Partial bootstrap from checkout
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-partial"
          mkdir -p "$HOME"
          export CODEX_HOME="$RUNNER_TEMP/codex-home-partial"
          export CLAUDE_CODE_HOME="$RUNNER_TEMP/claude-home-partial"
          export GEMINI_HOME="$RUNNER_TEMP/gemini-home-partial"
          export ANTIGRAVITY_HOME="$RUNNER_TEMP/antigravity-home-partial"
          project_dir="$RUNNER_TEMP/project-partial"
          cli_dir="$RUNNER_TEMP/bin-partial"

          bash scripts/bootstrap_qiongli.sh \
            --profile partial \
            --source-repo "$PWD" \
            --project-dir "$project_dir" \
            --cli-dir "$cli_dir" \
            --overwrite

          test -f "$CODEX_HOME/skills/qiongli-workflow/SKILL.md"
          test -f "$CLAUDE_CODE_HOME/skills/qiongli-workflow/SKILL.md"
          test -f "$GEMINI_HOME/skills/qiongli-workflow/SKILL.md"
          test -f "$CLAUDE_CODE_HOME/skills/qiongli-workflow/workflows/proofread.md"
          test -f "$GEMINI_HOME/skills/qiongli-workflow/workflows/paper.md"
          test ! -e "$cli_dir/qiongli"
          test ! -e "$project_dir/.agent"
          test ! -e "$project_dir/.gemini"
          test ! -e "$project_dir/.env"

      - name: Full bootstrap from checkout
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-full"
          mkdir -p "$HOME"
          export SHELL="/bin/zsh"
          export CODEX_HOME="$RUNNER_TEMP/codex-home-full"
          export CLAUDE_CODE_HOME="$RUNNER_TEMP/claude-home-full"
          export GEMINI_HOME="$RUNNER_TEMP/gemini-home-full"
          export ANTIGRAVITY_HOME="$RUNNER_TEMP/antigravity-home-full"
          project_dir="$RUNNER_TEMP/project-full"
          cli_dir="$RUNNER_TEMP/bin-full"

          bash scripts/bootstrap_qiongli.sh \
            --profile full \
            --source-repo "$PWD" \
            --project-dir "$project_dir" \
            --cli-dir "$cli_dir" \
            --no-doctor \
            --overwrite

          test -f "$CODEX_HOME/skills/qiongli-workflow/SKILL.md"
          test -f "$CLAUDE_CODE_HOME/skills/qiongli-workflow/workflows/proofread.md"
          test -f "$GEMINI_HOME/skills/qiongli-workflow/workflows/paper.md"
          test -f "$cli_dir/qiongli"
          test -x "$cli_dir/qiongli"
          if [[ ! -L "$cli_dir/rsk" && ! -f "$cli_dir/rsk" ]]; then
            echo "Missing CLI alias: $cli_dir/rsk" >&2
            exit 1
          fi
          if [[ ! -L "$cli_dir/rsw" && ! -f "$cli_dir/rsw" ]]; then
            echo "Missing CLI alias: $cli_dir/rsw" >&2
            exit 1
          fi
