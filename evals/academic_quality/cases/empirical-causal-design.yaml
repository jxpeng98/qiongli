schema_version: "1.0"
case_id: empirical-causal-design
pipeline: empirical-study
description: Require explicit causal-design assumptions, checks, and calibrated claims.
input:
  topic: Assess an observational study of job training and subsequent earnings.
  domain: economics
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - Identification assumptions
          - Measured confounders
          - Robustness and sensitivity checks
          - Claims are limited to the supported causal contrast
