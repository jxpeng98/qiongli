domain: finance
display_name: "Finance & Financial Engineering"

libraries:
  python:
    - arch          # GARCH, volatility models
    - QuantLib      # derivatives pricing, fixed income
    - PyPortfolioOpt # mean-variance, Black-Litterman
    - statsmodels   # OLS, panel, time series
    - linearmodels  # IV, panel (FE/RE), system GMM
    - yfinance      # market data retrieval
    - empyrical     # risk/return analytics
    - zipline-reloaded  # backtesting
  r:
    - rugarch       # univariate GARCH
    - rmgarch       # multivariate GARCH (DCC/BEKK)
    - PerformanceAnalytics # portfolio risk/return
    - quantmod      # data retrieval + charting
    - tidyquant     # tidy financial analysis
    - frm           # financial risk management
    - vars          # VAR / VECM time series
    - plm           # panel data
  stata:
    - arch/garch    # volatility models
    - xtreg         # panel data
    - ivregress     # instrumental variables
    - rolling       # rolling window estimation

method_templates:
  - name: "GARCH / Volatility Modeling"
    tier: standard
    library: arch (Python) / rugarch (R)
    checklist:
      - "Report AIC/BIC for model selection"
      - "Run Ljung-Box on standardized residuals"
      - "Test ARCH effects (Engle LM test) before fitting"
      - "Specify innovation distribution (normal / t / skewed-t)"
    assumptions:
      - "Return innovations are conditionally heteroskedastic with a correctly specified variance process."
      - "Standardized residual distribution matches the chosen innovation family sufficiently for inference."
    required_diagnostics:
      - "ARCH LM test and residual Ljung-Box tests on levels and squares."
      - "Information criteria and standardized residual distribution checks."
    required_artifacts:
      - "Conditional volatility series and parameter table."
      - "Residual diagnostic table and model selection comparison."
    failure_modes:
      - "Unmodeled leverage, regime shifts, or heavy tails bias volatility forecasts."
      - "Nonstationary or near-integrated variance dynamics."
    minimum_report_fields:
      - "Return frequency, sample window, mean equation, variance equation, and innovation distribution."
      - "Parameter estimates, persistence, diagnostics, and forecast horizon."

  - name: "Event Study"
    tier: standard
    library: statsmodels + custom
    checklist:
      - "Define estimation window (≥120 days) and event window"
      - "Use market model or Fama-French for expected returns"
      - "Report CAR with parametric (Patell) and non-parametric (rank) tests"
      - "Check for event-date clustering"
    assumptions:
      - "The event date is correctly timed and not anticipated by the market."
      - "Expected-return model captures normal returns over the estimation window."
    required_diagnostics:
      - "Estimation-window fit and event-date clustering assessment."
      - "Parametric and nonparametric abnormal-return tests."
    required_artifacts:
      - "AAR and CAR plot over the event window."
      - "CAR test table by window and expected-return model."
    failure_modes:
      - "Confounding events or leakage around the event date."
      - "Overlapping event windows creating dependent abnormal returns."
    minimum_report_fields:
      - "Event definition, event date source, estimation window, event windows, and benchmark model."
      - "AAR, CAR, test statistics, sample exclusions, and clustering treatment."

  - name: "Portfolio Optimization (MVO)"
    tier: standard
    library: PyPortfolioOpt
    checklist:
      - "Shrink covariance (Ledoit-Wolf) if N/T ratio is high"
      - "Report weights, expected return, risk, Sharpe ratio"
      - "Run sensitivity to return estimates"
    assumptions:
      - "Inputs approximate forward-looking expected returns, covariance, and constraints."
      - "Investor objective is adequately represented by mean-variance utility."
    required_diagnostics:
      - "Sensitivity to expected-return and covariance estimates."
      - "Constraint binding and weight concentration checks."
    required_artifacts:
      - "Efficient frontier and selected portfolio weights."
      - "Risk-return summary with turnover and constraint report."
    failure_modes:
      - "Estimation error produces unstable or concentrated weights."
      - "Ignoring transaction costs, liquidity, or short-sale constraints."
    minimum_report_fields:
      - "Asset universe, sample period, return estimator, covariance estimator, and constraints."
      - "Weights, expected return, volatility, Sharpe ratio, and sensitivity results."

  - name: "Fama-French / Factor Models"
    tier: standard
    library: linearmodels / statsmodels
    checklist:
      - "Use Fama-MacBeth or pooled with clustered SE"
      - "Report alpha, factor loadings, t-stats"
      - "Check for multicollinearity among factors"
      - "Double-sort or Fama-MacBeth cross-section explicitly"
    assumptions:
      - "Factor returns span systematic risk exposures relevant to the tested assets."
      - "Residuals are appropriately handled for serial and cross-sectional dependence."
    required_diagnostics:
      - "Factor correlation and multicollinearity checks."
      - "Residual autocorrelation and heteroskedasticity diagnostics."
    required_artifacts:
      - "Alpha and factor-loading regression table."
      - "Fama-MacBeth or portfolio-sort table with corrected standard errors."
    failure_modes:
      - "Omitted factors or data-snooped factors misstate alpha."
      - "Incorrect standard errors with overlapping returns or panel dependence."
    minimum_report_fields:
      - "Factor set, test assets, return frequency, sample period, and estimation method."
      - "Alphas, betas, t-statistics, R-squared, and standard-error correction."

  - name: "Options Pricing / Derivatives"
    tier: advanced
    library: QuantLib
    checklist:
      - "Specify payoff, exercise type, and market conventions"
      - "Validate vs closed-form (Black-Scholes) where possible"
      - "Report Greeks (delta, gamma, vega, theta)"
    assumptions:
      - "Pricing model dynamics and market conventions match the derivative being valued."
      - "Calibration inputs are contemporaneous and arbitrage-consistent."
    required_diagnostics:
      - "Calibration error against observed prices or implied volatilities."
      - "Sensitivity of price and Greeks to volatility, rates, and dividends."
    required_artifacts:
      - "Pricing inputs, model configuration, and valuation output."
      - "Greeks table and calibration or validation comparison."
    failure_modes:
      - "Mismatched day count, exercise style, settlement, or dividend conventions."
      - "Using Black-Scholes assumptions for products requiring stochastic volatility or path dependence."
    minimum_report_fields:
      - "Payoff, underlying, maturity, exercise style, market conventions, curve, and volatility input."
      - "Model, calibration source, price, Greeks, and validation benchmark."

stats_diagnostics:
  - "Stationarity: ADF / KPSS tests before time-series modeling"
  - "Heteroskedasticity: White / Breusch-Pagan tests"
  - "Serial correlation: Durbin-Watson / Ljung-Box"
  - "Cointegration: Johansen / Engle-Granger (for multivariate TS)"
  - "Look-ahead bias: ensure all features use only past data"
  - "Survivorship bias: document universe construction rules"

reporting_guidelines:
  primary: "Journal of Finance / RFS / JFE style"
  checklists:
    - "Summary statistics table (mean, sd, N, correlations)"
    - "Double-sort or Fama-MacBeth table"
    - "Robustness: alternative windows, subsamples, controls"

common_pitfalls:
  - "Look-ahead bias: using future information in feature construction"
  - "Survivorship bias: excluding delisted/bankrupt firms"
  - "Non-stationary series used in OLS → spurious regression"
  - "Ignoring transaction costs / market impact in backtests"
  - "Overlapping observations without Newey-West correction"
  - "Using daily returns for long-horizon event studies (volatility bias)"

visualization_templates:
  - "Cumulative Abnormal Return (CAR) event study plot"
  - "Efficient frontier with optimal portfolio markers"
  - "GARCH conditional volatility time series"
  - "Factor exposure bar chart (Fama-French loadings)"
  - "Rolling beta / rolling correlation plots"

reporting_standards:
  primary: "Top-3 Finance journal style"
  checklists: []
  required_tables:
    - "Summary statistics with winsorized variables"
    - "Correlation matrix"
    - "Main regression with progressive controls"
    - "Robustness (alternative measures, subsamples)"

default_databases:
  primary: [SSRN, WRDS, NBER]
  secondary: [Google Scholar, Scopus, EconLit]
  preprints: [SSRN]
  query_syntax_notes: "WRDS provides structured data access; SSRN free text search"

methodology_priors:
  identification: "Natural experiments or IV strongly preferred; event studies common"
  robustness: "Placebo tests, Fama-MacBeth SE, portfolio sorts"
  standard_hierarchy: [Natural_Experiment, IV, DID, Event_Study, Cross_Sectional_Regression]
  estimation_norms: "Double-clustered SE (firm + time); Newey-West for time series"

venue_norms:
  jf:
    sections: [Introduction, Data, Empirical_Strategy, Results, Conclusion]
    word_limit: 15000
    code_release: "Encouraged"
  jfe:
    sections: [Introduction, Institutional_Background, Data, Results, Conclusion]
    word_limit: 15000
    code_release: "Encouraged"
  rfs:
    sections: [Introduction, Model, Data, Results, Conclusion]
    word_limit: 15000
    code_release: "Expected"
