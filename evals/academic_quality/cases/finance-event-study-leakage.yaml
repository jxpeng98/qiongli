schema_version: "1.0"
case_id: finance-event-study-leakage
pipeline: empirical-study
description: Detect leakage and contaminated estimation windows in a finance event study.
input:
  topic: Assess an earnings-announcement event study with pre-event price movement and an overlapping estimation window.
  domain: finance
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - "Gate: Q1"
          - "Severity: block"
          - Event window shows leakage risk and the estimation window overlaps contaminated pre-event information.
