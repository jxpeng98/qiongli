# ─────────────────────────────────────────────
# Eval Case: Empirical DID Study (Minimum Wage)
# ─────────────────────────────────────────────

schema_version: "1.0"
case_id: empirical-did-minimum-wage
pipeline: empirical-study
description: "Difference-in-differences analysis of minimum wage increases on employment."

input:
  topic: "Effect of minimum wage increases on restaurant employment"
  domain: economics
  additional_context: "Using state-level variation in the US, 2015-2023"

expected_outputs:
  question-refiner:
    artifact: framing/research_question.md
    required: true
    assertions:
      - type: contains_all
        values: ["causal", "employment"]

  study-designer:
    artifact: study_design.md
    required: true
    assertions:
      - type: contains_all
        values: ["difference-in-differences", "parallel trends", "cluster"]

  robustness-planner:
    artifact: design/robustness_plan.md
    required: true
    assertions:
      - type: contains_all
        values: ["placebo", "staggered"]

  code-builder:
    artifact: analysis/
    required: true
    assertions:
      - type: contains_any
        values: ["fixest", "pyfixest", "reghdfe"]
