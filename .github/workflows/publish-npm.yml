name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/qiongli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python runtime dependency
        run: python -m pip install PyYAML

      - name: Verify tag matches repo version
        run: bash scripts/verify_release_tag_version.sh --tag "${GITHUB_REF_NAME}"

      - name: Run npm package preflight
        run: bash scripts/npm_preflight.sh

      - name: Publish to npm
        working-directory: packages/npm-qiongli
        run: |
          if [[ "${GITHUB_REF_NAME}" == *beta* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi
