# qiongli project defaults (packaged with the CLI).
#
# This file is overwritten in GitHub builds by `scripts/inject_project_toml.sh`
# so the packaged CLI can default to the correct upstream repo.
#
# You can override upstream at runtime via:
# - CLI:   `--repo <owner>/<repo>` (or a Git URL)
# - Env:   `QIONGLI_REPO=<owner>/<repo>` (or a Git URL)
#          Legacy `RESEARCH_SKILLS_REPO` remains supported as a fallback.
# - Project config: `qiongli.toml` / `.qiongli.toml` (see guides)

[upstream]
repo = "jxpeng98/qiongli"
url = "https://github.com/jxpeng98/qiongli"
