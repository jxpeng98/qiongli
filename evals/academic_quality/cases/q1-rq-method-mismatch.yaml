schema_version: "1.0"
case_id: q1-rq-method-mismatch
pipeline: empirical-study
description: Detect a research-question, method, and outcome mismatch.
input:
  topic: Assess a causal-mechanism question answered only with a descriptive prevalence survey.
  domain: general
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - "Gate: Q1"
          - "Severity: block"
          - Research question targets causal mechanism, but the method and outcome only support descriptive prevalence.
