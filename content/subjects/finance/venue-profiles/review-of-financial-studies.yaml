id: review-of-financial-studies
display_name: "Review of Financial Studies"
discipline: finance
quality_bar:
  - "Explain the research's quality and importance to financial economics."
  - "Match the contribution and evidence to the article type; theoretical and empirical papers need not each provide both types of contribution."
fit_notes:
  - "Local advice: explain what the findings or argument change in the reader's understanding of a finance question."
  - "Local advice: examine factor exposure, endogeneity, timing, benchmarks and robustness where material to the design; do not impose these on every paper."
  - "Local advice: an untested mechanism remains a hypothesis; significance to the field does not require claiming a mechanism the evidence cannot establish."
source_basis:
  - url: "https://sfs.org/review-of-financial-studies/aims-and-scope/"
    checked_on: "2026-10-08"
    supports: "The journal balances theoretical and empirical contributions and prioritizes quality and importance to finance."
usage_limits:
  - "Discovery aid, not a complete current submission checklist. Verify the selected article type and requirements under stage-H-submission.md."
  - "Fit notes are project advice, not mandatory journal rules or a prediction of acceptance."
