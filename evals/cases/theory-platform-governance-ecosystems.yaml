# ─────────────────────────────────────────────
# Eval Case: Theory Paper (Platform Governance + Ecosystems)
# ─────────────────────────────────────────────

schema_version: "1.0"
case_id: theory-platform-governance-ecosystems
pipeline: theory-paper
description: "Conceptual paper on how platform governance shapes complementor innovation in digital ecosystems."

input:
  topic: "How platform governance shapes complementor innovation in digital ecosystems"
  domain: management
  additional_context: "Focus on theory development, mechanism clarity, and boundary conditions rather than empirical estimation"

expected_outputs:
  question-refiner:
    artifact: framing/research_question.md
    required: true
    assertions:
      - type: contains_all
        values: ["platform governance", "complementor", "boundary condition"]

  academic-searcher:
    artifact: search_strategy.md
    required: true
    assertions:
      - type: contains_all
        values: ["platform ecosystem", "governance"]
      - type: contains_any
        values: ["Web of Science", "Scopus"]

  gap-analyzer:
    artifact: gap_analysis.md
    required: true
    assertions:
      - type: contains_all
        values: ["theoretical gap", "boundary condition", "complementor"]

  theory-mapper:
    artifact: theoretical_framework.md
    required: true
    assertions:
      - type: contains_all
        values: ["mermaid", "proposition", "mechanism"]

  hypothesis-generator:
    artifact: framing/hypothesis.md
    required: true
    assertions:
      - type: contains_all
        values: ["proposition", "governance", "innovation"]

  manuscript-architect:
    artifact: manuscript/manuscript.md
    required: true
    assertions:
      - type: contains_all
        values: ["theoretical contribution", "mechanism", "boundary condition"]

  submission-packager:
    artifact: submission/cover_letter.md
    required: true
    assertions:
      - type: contains_all
        values: ["theory paper", "contribution"]
