name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for trusted publishing

jobs:
  build-and-publish:
    if: ${{ github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'release/1.x-python') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qiongli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject native release lines
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_line="$(python3 scripts/release_version.py "$package_version" --print-field release_line)"
          if [[ "$release_line" != "legacy-1x" ]]; then
            echo "[testpypi-publish] native release lines must not publish the frozen Python package" >&2
            exit 1
          fi

      - name: Inject packaged upstream defaults
        env:
          RESEARCH_SKILLS_REPO_SLUG: jxpeng98/qiongli
        run: bash scripts/inject_project_toml.sh

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
