name: Setup Qiongli Tauri and Svelte build
description: Install pinned frontend tooling, Linux WebView prerequisites, and build the static desktop assets.

inputs:
  run-frontend-checks:
    description: Run TypeScript, Svelte, and component tests before building.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux Tauri prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for source in \
          /etc/apt/apt-mirrors.txt \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/ubuntu.sources; do
          if [[ -f "$source" ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
              "$source"
          fi
        done
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20
        )
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Setup pinned pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.13.1
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm

    - name: Install locked frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check and test frontend contracts
      if: inputs.run-frontend-checks == 'true'
      shell: bash
      env:
        CARGO_HOME: ${{ runner.temp }}/qiongli-cargo-home
        CARGO_BUILD_RUSTC_WRAPPER: ""
        CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
        CARGO_BUILD_RUSTFLAGS: ""
        CARGO_ENCODED_RUSTFLAGS: ""
        RUSTC_WORKSPACE_WRAPPER: ""
        RUSTC_WRAPPER: ""
        RUSTFLAGS: ""
      run: |
        pnpm --dir packages/qiongli-app-api check
        pnpm --dir packages/qiongli-desktop check
        pnpm --dir packages/npm-qiongli test
        pnpm --dir packages/qiongli-app-api test
        pnpm --dir packages/qiongli-desktop test

    - name: Build static Svelte desktop assets
      shell: bash
      run: pnpm --dir packages/qiongli-desktop build

    - name: Reject development-only fixture bytes
      shell: bash
      run: |
        if rg -a \
          'fixture-verification-complete|dev-fixture-command-unsupported' \
          packages/qiongli-desktop/build; then
          echo "Development fixture bytes entered the production frontend." >&2
          exit 1
        fi
