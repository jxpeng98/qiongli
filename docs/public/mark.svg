<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Qiongli logo</title>
  <desc id="desc">A Q-shaped research mark with an internal evidence path.</desc>
  <defs>
    <linearGradient id="qiongli-ring" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.58" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="#f8fafc" filter="url(#soft-shadow)"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#dbe4ea" stroke-width="2"/>
  <circle cx="61" cy="59" r="30" fill="none" stroke="url(#qiongli-ring)" stroke-width="12"/>
  <path d="M80 80l19 19" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <path d="M39 62l15-14 16 11 16-18" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="39" cy="62" r="5" fill="#0f766e"/>
  <circle cx="54" cy="48" r="5" fill="#1d4ed8"/>
  <circle cx="70" cy="59" r="5" fill="#1d4ed8"/>
  <circle cx="86" cy="41" r="5" fill="#c2410c"/>
</svg>
