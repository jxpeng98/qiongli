name: Native CLI distribution

on:
  push:
    branches: ['main', '2.x', 'codex/cli-distribution-*']
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify the locally qualified draft release packet at this immutable tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.verify_release != true
    name: Build and install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/qiongli-native/target
          key: cli-${{ matrix.target }}-1.97-${{ hashFiles('packages/qiongli-native/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cli-${{ matrix.target }}-1.97-${{ hashFiles('packages/qiongli-native/Cargo.lock') }}-
      - name: Install Linux wheel audit tools
        if: runner.os == 'Linux'
        run: python -m pip install auditwheel patchelf
      - name: Check native distribution tooling
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_native_marketplace_plugins tests.test_native_release_assets tests.test_native_cli_release -q
      - name: Build, package and install on target
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packages/qiongli-native/Cargo.toml','rb'))['workspace']['package']['version'])")
          python tooling/scripts/native_cli_release.py --version "$version" --target '${{ matrix.target }}' --out-dir "$RUNNER_TEMP/cli-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/cli-candidate/assets
          if-no-files-found: error

  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Draft discovery requires push access; no candidate code runs here.
    steps:
      - name: Download the maintainer's complete draft packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  install:
    needs: candidate
    name: Verify combined package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release && github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/assets
      - name: Check local macOS evidence and install combined packages
        shell: bash
        run: |
          python tooling/scripts/native_release_assets.py check-install --root "$RUNNER_TEMP/assets" --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/install-check"
      - name: Check all three wheel metadata records
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check "$RUNNER_TEMP/assets/"*.whl
      - name: Check Windows npm command shims
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/install-check/registry/npm/qiongli.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/install-check/registry/npm/ql.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}
          path: ${{ runner.temp }}/install-check/install-check.json
          if-no-files-found: error
