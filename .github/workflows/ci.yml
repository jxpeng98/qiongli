name: CI

on:
  push:
    branches: ["main", "master", "dev"]
    paths-ignore:
      - "release/acceptance/**"
  pull_request:
    branches: ["main", "master", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-tests:
    name: Cross-platform tests (${{ matrix.os }}, ${{ matrix.test-tier }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-tier: full
          - os: windows-latest
            test-tier: windows-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inject packaged upstream defaults
        shell: bash
        run: bash scripts/inject_project_toml.sh

      - name: Install Python dependencies
        run: python -m pip install .

      - name: Compile critical modules
        run: python -m py_compile packages/python-qiongli/src/qiongli/bridges/base_bridge.py packages/python-qiongli/src/qiongli/bridges/orchestrator.py scripts/validate_research_standard.py tests/test_orchestrator_workflows.py tests/test_install_qiongli.py

      - name: Check generated payload edits
        run: python scripts/check_generated_payload_edits.py --base-ref origin/dev

      - name: Materialize distribution payloads
        if: matrix.test-tier == 'full'
        run: python scripts/materialize_distribution_payloads.py --target all --out "$RUNNER_TEMP/qiongli-dist" --force

      - name: Audit staged distribution payloads
        if: matrix.test-tier == 'full'
        run: python scripts/audit_distribution_payloads.py --root "$RUNNER_TEMP/qiongli-dist"

      - name: Validate research standard
        if: matrix.test-tier == 'full'
        run: python scripts/validate_research_standard.py --root "$RUNNER_TEMP/qiongli-dist" --strict

      - name: Run full unit tests
        if: matrix.test-tier == 'full'
        run: python -m unittest discover -s tests -v

      - name: Run Windows smoke tests
        if: matrix.test-tier == 'windows-smoke'
        run: python -m unittest tests.test_install_qiongli tests.test_bootstrap_qiongli tests.test_universal_installer tests.test_command_runtime tests.test_release_automation tests.test_branch_policy

  shell-release-gates:
    name: Shell and release gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inject packaged upstream defaults
        run: bash scripts/inject_project_toml.sh

      - name: Install Python dependencies
        run: python -m pip install .

      - name: Compile critical modules
        run: python -m py_compile packages/python-qiongli/src/qiongli/bridges/base_bridge.py packages/python-qiongli/src/qiongli/bridges/orchestrator.py scripts/validate_research_standard.py tests/test_orchestrator_workflows.py

      - name: Validate shell scripts syntax
        run: |
          bash -n scripts/run_beta_smoke.sh
          bash -n scripts/generate_release_notes.sh
          bash -n scripts/release_ready.sh
          bash -n scripts/release_preflight.sh
          bash -n scripts/release_postflight.sh
          bash -n scripts/release_automation.sh
          bash -n scripts/install_qiongli.sh
          bash -n scripts/inject_project_toml.sh
          bash -n scripts/sync_skill_package.sh

      - name: Run standardized pre-release gates
        run: ./scripts/release_preflight.sh --quick --materialize-out "$RUNNER_TEMP/qiongli-preflight-dist"
