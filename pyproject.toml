[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiongli"
version = "0.9.0b4"
description = "Installer/upgrader CLI for qiongli (Codex / Claude Code / Gemini) without requiring a git fork."
readme = "README_PYPI.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.1"
]
license = "MIT"
authors = [{name = "Jiaxin Peng"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/jxpeng98/qiongli"
Repository = "https://github.com/jxpeng98/qiongli"
"Bug Tracker" = "https://github.com/jxpeng98/qiongli/issues"

[project.scripts]
qiongli = "qiongli.cli:main"
ql = "qiongli.cli:main"
research-skills = "qiongli.cli:main"
rsk = "qiongli.cli:main"
rsw = "qiongli.cli:main"

[tool.setuptools]
packages = ["qiongli", "research_skills"]

[tool.setuptools.package-data]
qiongli = ["project.toml", "install_manifest.tsv"]
