name: Release Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run diagnostic/recovery phase"
        required: true
        type: choice
        default: pre
        options:
          - pre
          - post
      tag:
        description: "Release tag (for example v0.1.0 or v0.1.1-beta.1)"
        required: true
        type: string
      skip_smoke:
        description: "Skip smoke checks in pre mode"
        required: false
        type: boolean
        default: false
      maintainer_smoke:
        description: "Run maintainer smoke tier in pre mode"
        required: false
        type: boolean
        default: false
      skip_note_gen:
        description: "Skip prerelease release-note draft generation in pre mode"
        required: false
        type: boolean
        default: false
      note_overwrite:
        description: "Overwrite existing prerelease release-note draft in pre mode"
        required: false
        type: boolean
        default: false
      from_tag:
        description: "Optional baseline tag for prerelease release-note draft highlights"
        required: false
        type: string
      skip_remote:
        description: "Skip remote ref checks in post mode"
        required: false
        type: boolean
        default: false
      skip_ci_status:
        description: "Skip GitHub Actions status check in post mode"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Create GitHub release page in post mode"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install release dependencies
        run: python -m pip install -e . build twine

      - name: Inject packaged upstream defaults
        run: bash scripts/inject_project_toml.sh

      - name: Materialize distribution payloads
        run: python3 scripts/materialize_distribution_payloads.py --target all --out "$RUNNER_TEMP/qiongli-release-dist" --force

      - name: Build package
        run: cd "$RUNNER_TEMP/qiongli-release-dist" && python -m build

      - name: Run release automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --prune origin +refs/heads/*:refs/remotes/origin/* +refs/tags/*:refs/tags/*
          mode="${{ inputs.mode }}"
          tag="${{ inputs.tag }}"
          args=()

          if [[ -z "$tag" ]]; then
            echo "${mode} mode requires 'tag' input" >&2
            exit 2
          fi
          args+=(--tag "$tag")
          if [[ "$mode" == "pre" ]]; then
            args+=(--materialize-out "$RUNNER_TEMP/qiongli-preflight-dist")
          fi

          if [[ "${{ inputs.skip_smoke }}" == "true" ]]; then
            args+=(--skip-smoke)
          fi
          if [[ "${{ inputs.maintainer_smoke }}" == "true" ]]; then
            args+=(--maintainer-smoke)
          fi
          if [[ "${{ inputs.skip_note_gen }}" == "true" ]]; then
            args+=(--skip-note-gen)
          fi
          if [[ "${{ inputs.note_overwrite }}" == "true" ]]; then
            args+=(--note-overwrite)
          fi
          if [[ -n "${{ inputs.from_tag }}" ]]; then
            args+=(--from-tag "${{ inputs.from_tag }}")
          fi
          if [[ "${{ inputs.skip_remote }}" == "true" ]]; then
            args+=(--skip-remote)
          fi
          if [[ "${{ inputs.skip_ci_status }}" == "true" ]]; then
            args+=(--skip-ci-status)
          fi
          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            args+=(--create-release)
          fi

          bash scripts/verify_release_tag_version.sh --root "$RUNNER_TEMP/qiongli-release-dist" --tag "$tag"

          ./scripts/release_automation.sh "$mode" "${args[@]}"

      - name: Upload release acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance
          path: tooling/release/acceptance/
          if-no-files-found: ignore
