schema_version: "1.0"
case_id: q3-reporting-gap
pipeline: empirical-study
description: Detect a missing reporting checklist in a submission package.
input:
  topic: Assess a submission-ready manuscript package that omits its required reporting checklist.
  domain: general
expected_outputs:
  quality-assessment:
    artifact: quality_findings.md
    required: true
    assertions:
      - type: contains_all
        values:
          - "Gate: Q3"
          - "Severity: warn"
          - Submission package lacks the required reporting checklist for the paper type.
