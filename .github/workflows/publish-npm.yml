name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.12.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/qiongli
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python runtime dependency
        run: python -m pip install -e .

      - name: Sync generated distribution payloads
        run: |
          bash scripts/sync_skill_package.sh --target all
          python3 scripts/sync_npm_package_payload.py

      - name: Verify tag matches repo version
        run: bash scripts/verify_release_tag_version.sh --tag "${RELEASE_TAG}"

      - name: Run npm package preflight
        run: bash scripts/npm_preflight.sh

      - name: Publish to npm
        working-directory: packages/npm-qiongli
        run: |
          if [[ "${RELEASE_TAG}" == *beta* ]]; then
            npm publish --tag next
            latest="$(npm view qiongli dist-tags.latest --silent || true)"
            if [[ "$latest" == *"-beta."* ]]; then
              npm dist-tag rm qiongli latest || echo "[npm-publish] warning: unable to remove beta latest dist-tag"
            fi
          else
            npm publish --tag latest
          fi
