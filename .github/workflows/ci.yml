name: CI

on:
  push:
    branches: ["main", "master", "dev", "2.x"]
    paths-ignore:
      - "tooling/release/acceptance/**"
  pull_request:
    branches: ["main", "master", "dev", "2.x"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lite-mcp:
    name: Rust Lite MCP quality and release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js for legacy MCPB parity
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/qiongli-lite-mcp/Cargo.toml -- --check

      - name: Run Rust clippy
        run: cargo clippy --locked --manifest-path packages/qiongli-lite-mcp/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path packages/qiongli-lite-mcp/Cargo.toml --all-targets

      - name: Run legacy Node MCPB reference tests
        run: npm --prefix packages/qiongli-literature-mcpb test

      - name: Build current-host Rust Lite release artifact
        run: python tooling/scripts/build_lite_mcp.py --target current --out-dir "$RUNNER_TEMP/qiongli-lite-mcp"

      - name: Upload current-host identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: qiongli-lite-mcp-linux-x86_64
          path: |
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider.target.json
          if-no-files-found: error

  rust-lite-mcp-windows:
    name: Rust Lite MCP tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js for legacy MCPB Windows checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/qiongli-lite-mcp/Cargo.toml -- --check

      - name: Run Rust clippy
        run: cargo clippy --locked --manifest-path packages/qiongli-lite-mcp/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows provider-config ACL evidence
        run: cargo test --locked --manifest-path packages/qiongli-lite-mcp/Cargo.toml --lib windows_ -- --nocapture

      - name: Run Rust tests
        run: cargo test --locked --manifest-path packages/qiongli-lite-mcp/Cargo.toml --all-targets

      - name: Run legacy Node MCPB Windows tests
        run: npm --prefix packages/qiongli-literature-mcpb test

      - name: Build current-host Rust Lite release artifact
        run: python tooling/scripts/build_lite_mcp.py --target current --out-dir "$env:RUNNER_TEMP/qiongli-lite-mcp"

      - name: Run built Windows artifact A1 acceptance
        shell: pwsh
        run: |
          & ./tooling/scripts/windows_a1_acceptance.ps1 `
            -BinaryPath "$env:RUNNER_TEMP/qiongli-lite-mcp/qiongli-literature-provider.exe" `
            -EvidencePath "$env:RUNNER_TEMP/qiongli-lite-mcp/windows-a1-acceptance.json"

      - name: Upload current-host identity evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qiongli-lite-mcp-windows-x86_64
          path: |
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider.exe
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider.target.json
            ${{ runner.temp }}/qiongli-lite-mcp/windows-a1-acceptance.json
          if-no-files-found: error

      - name: Upload partial Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qiongli-lite-mcp-windows-x86_64-partial
          path: |
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider.exe
            ${{ runner.temp }}/qiongli-lite-mcp/qiongli-literature-provider.target.json
            ${{ runner.temp }}/qiongli-lite-mcp/windows-a1-acceptance.json
          if-no-files-found: warn

  rust-native-foundation:
    name: Rust native foundation (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Reject injected target-specific Rust flags
        shell: bash
        run: |
          injected=0
          while IFS='=' read -r name value; do
            case "$name" in
              CARGO_TARGET_*_RUSTFLAGS)
                if [[ -n "$value" ]]; then
                  echo "Unexpected Rust compiler override: $name" >&2
                  injected=1
                fi
                ;;
            esac
          done < <(env)
          [[ "$injected" -eq 0 ]]

      - name: Check native Rust formatting
        env:
          CARGO_HOME: ${{ runner.temp }}/qiongli-cargo-home
          CARGO_BUILD_RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
          CARGO_BUILD_RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
        run: cargo fmt --manifest-path packages/qiongli-native/Cargo.toml --all -- --check

      - name: Run native Rust clippy
        env:
          CARGO_HOME: ${{ runner.temp }}/qiongli-cargo-home
          CARGO_BUILD_RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
          CARGO_BUILD_RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
        run: cargo clippy --manifest-path packages/qiongli-native/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run native Rust tests
        env:
          CARGO_HOME: ${{ runner.temp }}/qiongli-cargo-home
          CARGO_BUILD_RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
          CARGO_BUILD_RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
        run: cargo test --manifest-path packages/qiongli-native/Cargo.toml --workspace --all-targets --all-features --locked

  cross-platform-tests:
    name: Cross-platform tests (${{ matrix.os }}, ${{ matrix.test-tier }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-tier: full
          - os: windows-latest
            test-tier: windows-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Inject packaged upstream defaults
        shell: bash
        run: bash scripts/inject_project_toml.sh

      - name: Install Python dependencies
        run: python -m pip install .

      - name: Compile critical modules
        run: python -m py_compile packages/python-qiongli/src/qiongli/bridges/base_bridge.py packages/python-qiongli/src/qiongli/bridges/orchestrator.py scripts/validate_research_standard.py tests/test_orchestrator_workflows.py tests/test_install_qiongli.py

      - name: Compile CTR-201A inventory validator
        run: python -m py_compile scripts/validate_ctr_201_inventory.py tooling/scripts/validate_ctr_201_inventory.py tests/test_ctr_201_inventory.py

      - name: Resolve generated payload comparison base
        id: generated-payload-base
        shell: bash
        env:
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ -n "$PULL_REQUEST_BASE" ]]; then
            base_ref="origin/$PULL_REQUEST_BASE"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "$zero_sha" ]] &&
               git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base_ref="$PUSH_BEFORE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi

          echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Check generated payload edits
        shell: bash
        env:
          GENERATED_PAYLOAD_BASE: ${{ steps.generated-payload-base.outputs.base-ref }}
        run: >-
          python scripts/check_generated_payload_edits.py
          --base-ref "$GENERATED_PAYLOAD_BASE"

      - name: Validate repository source policy
        shell: bash
        env:
          GENERATED_PAYLOAD_BASE: ${{ steps.generated-payload-base.outputs.base-ref }}
        run: >-
          python scripts/validate_repository_source.py
          --base-ref "$GENERATED_PAYLOAD_BASE"

      - name: Validate CTR-201A semantic inventory
        run: python scripts/validate_ctr_201_inventory.py

      - name: Protect frozen migration baseline
        shell: bash
        env:
          GENERATED_PAYLOAD_BASE: ${{ steps.generated-payload-base.outputs.base-ref }}
        run: >-
          python scripts/check_frozen_migration_baseline.py
          --base-ref "$GENERATED_PAYLOAD_BASE"

      - name: Protect frozen 2.x architecture baseline
        shell: bash
        env:
          GENERATED_PAYLOAD_BASE: ${{ steps.generated-payload-base.outputs.base-ref }}
        run: >-
          python scripts/check_frozen_2x_architecture_baseline.py
          --base-ref "$GENERATED_PAYLOAD_BASE"

      - name: Validate 2.x branch-point evidence
        run: python scripts/validate_2x_branch_point.py

      - name: Validate ARC-201 architecture decisions
        run: python scripts/validate_arc_201_adrs.py

      - name: Materialize distribution payloads
        if: matrix.test-tier == 'full'
        run: python scripts/materialize_distribution_payloads.py --target all --out "$RUNNER_TEMP/qiongli-dist" --force

      - name: Audit staged distribution payloads
        if: matrix.test-tier == 'full'
        run: python scripts/audit_distribution_payloads.py --root "$RUNNER_TEMP/qiongli-dist"

      - name: Validate research standard
        if: matrix.test-tier == 'full'
        run: python scripts/validate_research_standard.py --root "$RUNNER_TEMP/qiongli-dist" --strict

      - name: Run full unit tests
        if: matrix.test-tier == 'full'
        run: python -m unittest discover -s tests -v

      - name: Run Windows smoke tests
        if: matrix.test-tier == 'windows-smoke'
        run: >-
          python -m unittest
          tests.test_install_qiongli
          tests.test_bootstrap_qiongli
          tests.test_universal_installer
          tests.test_command_runtime
          tests.test_release_automation
          tests.test_branch_policy
          tests.test_2x_branch_point
          tests.test_arc_201_adrs
          tests.test_frozen_2x_architecture_baseline
          tests.test_repository_source_validator
          tests.test_ctr_201_inventory

  shell-release-gates:
    name: Shell and release gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Inject packaged upstream defaults
        run: bash scripts/inject_project_toml.sh

      - name: Install Python dependencies
        run: python -m pip install .

      - name: Compile critical modules
        run: python -m py_compile packages/python-qiongli/src/qiongli/bridges/base_bridge.py packages/python-qiongli/src/qiongli/bridges/orchestrator.py scripts/validate_research_standard.py tests/test_orchestrator_workflows.py

      - name: Validate Capability Contract v2 pilot
        run: python scripts/validate_capability_contract.py

      - name: Validate shell scripts syntax
        run: |
          bash -n scripts/run_beta_smoke.sh
          bash -n scripts/generate_release_notes.sh
          bash -n scripts/release_ready.sh
          bash -n scripts/release_preflight.sh
          bash -n scripts/release_postflight.sh
          bash -n scripts/release_automation.sh
          bash -n scripts/install_qiongli.sh
          bash -n scripts/inject_project_toml.sh
          bash -n scripts/sync_skill_package.sh

      - name: Run standardized pre-release gates
        run: ./scripts/release_preflight.sh --quick --materialize-out "$RUNNER_TEMP/qiongli-preflight-dist"
