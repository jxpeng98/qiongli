[package]
name = "qiongli-lite-mcp"
version = "0.2.0-beta.3"
edition = "2021"
license = "MIT"

[[bin]]
name = "qiongli-literature-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
quick-xml = "0.36"
url = "2"
